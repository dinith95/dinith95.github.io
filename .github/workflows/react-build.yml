# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "master", "develop", "feature/fix-deploy" ]
  pull_request:
    branches: [ "master", "develop", "feature/fix-deploy" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.x

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Install NPM packages
      run: npm --prefix ./dinith-potrofolio ci

    - name: Build project
      run: npm --prefix ./dinith-potrofolio run build -prod

    - name: SPA fallback
      run: cp ./dinith-potrofolio/build/index.html ./dinith-potrofolio/build/404.html

    - name: Upload production-ready build files
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dinith-potrofolio/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/fix-deploy'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
